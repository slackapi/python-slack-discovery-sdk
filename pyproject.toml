[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-discovery-sdk"
dynamic = ["version", "readme"]
description = "The Slack Discovery API SDK for Python"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Slack Technologies, LLC", email = "opensource@slack.com" }]
requires-python = ">=3.7"
dependencies = []
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"Topic :: Communications :: Chat",
	"Topic :: Office/Business",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.7",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Programming Language :: Python :: Implementation :: CPython",
]


[project.urls]
Homepage = "https://github.com/slackapi/python-slack-discovery-sdk"
Documentation = "https://slack.com/help/articles/360002079527-A-guide-to-Slacks-Discovery-APIs"
Source = "https://github.com/slackapi/python-slack-discovery-sdk"

[tool.setuptools.packages.find]
include = ["slack_discovery_sdk*"]

[tool.setuptools.dynamic]
version = { attr = "slack_discovery_sdk.version.__version__" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.pytest.ini_options]
testpaths = ["tests"]
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
markers = ["live: calls the real Discovery API and needs the SLACK_DISCOVERY_SDK_TEST_* env variables"]
filterwarnings = [
	'ignore:"@coroutine" decorator is deprecated since Python 3.8, use "async def" instead:DeprecationWarning',
	"ignore:The loop argument is deprecated since Python 3.8, and scheduled for removal in Python 3.10.:DeprecationWarning",
]
